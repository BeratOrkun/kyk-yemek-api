name: KYK Menu Sync

on:
  schedule:
    # Her gün TSI 06:00 (UTC 03:00), 12:00 (UTC 09:00), 18:00 (UTC 15:00)
    - cron: '0 3,9,15 * * *'
  workflow_dispatch: # GitHub UI üzerinden manuel tetikleme butonu

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Menüleri Topla ve Güncelle
        run: |
          python scripts/sync_data.py

      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Menülerde yeni bir değişiklik yok, commit atılmadı."
          else
            git commit -m "chore(data): auto-update KYK menus [skip ci]"
            git push
          fi
